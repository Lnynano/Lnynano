<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-label="Kiktichej Sintaosathapon (Lnynano) — Computer Engineering student at Thammasat University">
  <style>
    .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .sans { font-family: -apple-system, 'Segoe UI', 'Noto Sans Thai', Helvetica, Arial, sans-serif; }
    .line { opacity: 0; animation: in .4s ease forwards; }
    .l1 { animation-delay: .2s; } .l2 { animation-delay: .7s; } .l3 { animation-delay: 1.1s; }
    .l4 { animation-delay: 1.5s; } .l5 { animation-delay: 1.9s; } .l6 { animation-delay: 2.3s; }
    @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .dot { animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  </style>
  <defs>
    <pattern id="hz" width="24" height="6" patternUnits="userSpaceOnUse" patternTransform="skewX(-45)">
      <rect width="12" height="6" fill="#8E5CF7"/>
    </pattern>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1A1622" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1000" height="280" rx="14" fill="#0A0A0C"/>
  <rect width="1000" height="280" rx="14" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="999" height="279" rx="14" fill="none" stroke="#3A3046"/>

  <!-- window bar -->
  <circle cx="28" cy="26" r="6" fill="#FF5F57"/>
  <circle cx="48" cy="26" r="6" fill="#FEBC2E"/>
  <circle cx="68" cy="26" r="6" fill="#28C840"/>
  <text x="500" y="31" text-anchor="middle" class="mono" font-size="13" fill="#8E879C">lnynano@thammasat: ~</text>
  <rect x="0" y="48" width="1000" height="6" fill="url(#hz)"/>

  <!-- left: name -->
  <g class="line l1"><text x="40" y="96" class="mono" font-size="16" fill="#8E879C">$ whoami</text><rect class="cursor" x="128" y="82" width="9" height="18" fill="#39FF6A"/></g>
  <g class="line l2"><text x="40" y="148" class="sans" font-size="44" font-weight="700" fill="#F2EFF7">Kiktichej Sintaosathapon</text></g>
  <g class="line l3"><text x="40" y="184" class="sans" font-size="19" fill="#CFCAD8">Computer Engineering · Thammasat University</text></g>
  <g class="line l4"><text x="40" y="214" class="sans" font-size="17" fill="#A9A3B5">นักศึกษาวิศวกรรมคอมพิวเตอร์ มหาวิทยาลัยธรรมศาสตร์</text></g>
  <g class="line l5">
    <circle class="dot" cx="46" cy="246" r="5" fill="#39FF6A"/>
    <text x="60" y="251" class="mono" font-size="14" fill="#8E879C">building practical tools for everyday problems</text>
  </g>

  <!-- right: spec block -->
  <g class="line l6 mono" font-size="14">
    <rect x="690" y="76" width="270" height="172" rx="10" fill="#141218" stroke="#3A3046"/>
    <text x="710" y="106" fill="#8E879C">handle</text><text x="800" y="106" fill="#39FF6A">@lnynano</text>
    <text x="710" y="134" fill="#8E879C">focus</text><text x="800" y="134" fill="#CFCAD8">web · data · AI</text>
    <text x="710" y="162" fill="#8E879C">stack</text><text x="800" y="162" fill="#CFCAD8">Python · JS</text>
    <text x="710" y="190" fill="#8E879C">speaks</text><text x="800" y="190" fill="#CFCAD8">ไทย / EN</text>
    <text x="710" y="218" fill="#8E879C">site</text><text x="800" y="218" fill="#39FF6A">lnynano.com</text>
  </g>
</svg>
