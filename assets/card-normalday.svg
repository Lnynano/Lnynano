<svg xmlns="http://www.w3.org/2000/svg" width="490" height="190" viewBox="0 0 490 190" role="img" aria-label="Normalday — everyday tools for life in Thailand. React, TypeScript, Vite, PWA.">
  <style>
    .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .sans { font-family: -apple-system, 'Segoe UI', 'Noto Sans Thai', Helvetica, Arial, sans-serif; }
    .live { animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
  </style>
  <rect x="0.5" y="0.5" width="489" height="189" rx="12" fill="#0A0A0C" stroke="#3A3046"/>
