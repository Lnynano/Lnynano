    <rect x="94" y="142" width="92" height="24" rx="12" fill="#141218" stroke="#3A3046"/><text x="140" y="158" text-anchor="middle">TypeScript</text>
    <rect x="194" y="142" width="50" height="24" rx="12" fill="#141218" stroke="#3A3046"/><text x="219" y="158" text-anchor="middle">Vite</text>
    <rect x="252" y="142" width="46" height="24" rx="12" fill="#141218" stroke="#3A3046"/><text x="275" y="158" text-anchor="middle">PWA</text>
