  <rect x="0" y="0" width="6" height="190" fill="#39FF6A" clip-path="url(#c)"/>
  <text x="28" y="38" class="mono" font-size="12" fill="#39FF6A">01 · PWA · TH/EN</text>
  <circle class="live" cx="404" cy="34" r="5" fill="#FF2D3D"/>
  <text x="416" y="38" class="mono" font-size="12" fill="#FF2D3D">LIVE</text>
  <text x="28" y="72" class="sans" font-size="26" font-weight="700" fill="#F2EFF7">Normalday</text>
  <text x="28" y="100" class="sans" font-size="14" fill="#CFCAD8">Everyday tools for life in Thailand — laundry,</text>
  <text x="28" y="120" class="sans" font-size="14" fill="#CFCAD8">electric bills, bill split. Works offline.</text>
